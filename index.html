<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>チャージ・ラン — 1キーで遊ぶ避けゲー</title>
  <meta name="description" content="押すだけで跳ぶ 1 キーの避けゲー。空中の充電帯に居るほど稼げて、満タンで無敵。2000 点でクリア。">
  <meta name="theme-color" content="#000000">

  <!-- X / OGP カード。画像は 240x135 の画面を 5 倍にした 1200x675 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="チャージ・ラン — 1キーで遊ぶ避けゲー">
  <meta property="og:description" content="充電帯に居るほど稼げて、満タンで無敵。2000 点でクリア。">
  <meta property="og:url" content="https://cosara22.github.io/chargerun/">
  <meta property="og:image" content="https://cosara22.github.io/chargerun/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="チャージ・ラン — 1キーで遊ぶ避けゲー">
  <meta name="twitter:description" content="充電帯に居るほど稼げて、満タンで無敵。2000 点でクリア。">
  <meta name="twitter:image" content="https://cosara22.github.io/chargerun/og.png">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 13'%3E%3Crect width='10' height='13' fill='%23fae878'/%3E%3Crect x='7' y='3' width='1' height='1'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #07070a;
      --fg: #ebebf0;
      --muted: #8a8a96;
      --band: #3cd2eb;
      --clear: #fff05a;
      --rule: #26262e;
      --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px calc(16px + env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 960px; }
    h1 {
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: 0.08em;
      color: var(--band);
      margin: 0 0 10px;
    }
    h1 small { color: var(--muted); font-size: 12px; letter-spacing: 0; margin-left: 8px; }
    .stage { position: relative; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 240 / 135;
      image-rendering: pixelated;
      background: #000;
      border: 1px solid var(--rule);
      cursor: pointer;
      outline: none;
      /* 長押しで選択・拡大鏡・スクロールが出ないようにする (スマホ) */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    canvas:focus-visible { border-color: var(--band); }
    #mute {
      position: absolute;
      right: 8px;
      bottom: 8px;
      font: 11px var(--mono);
      color: rgba(255, 255, 255, 0.85);
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 4px 8px;
      cursor: pointer;
    }
    #mute:hover { border-color: rgba(255, 255, 255, 0.6); }
    #clear-panel {
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--clear);
      background: #0e0e08;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      justify-content: space-between;
    }
    #clear-panel[hidden] { display: none; }
    #clear-panel p { margin: 0; font-size: 14px; }
    #clear-panel strong { color: var(--clear); font-family: var(--mono); letter-spacing: 0.06em; margin-right: 8px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-x { background: #fff; color: #000; }
    .btn-x:hover { background: #e6e6e6; }
    .btn-x svg { width: 16px; height: 16px; }
    .btn-ghost { background: transparent; color: var(--fg); border-color: var(--rule); }
    .btn-ghost:hover { border-color: var(--muted); }
    .howto {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .howto b { color: var(--fg); font-weight: 600; }
    footer { margin-top: 20px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>CHARGE RUN <small>チャージ・ラン</small></h1>

    <div class="stage">
      <canvas id="game" tabindex="0" aria-label="チャージ・ランのゲーム画面。押すとジャンプ、長押しで大ジャンプ。"></canvas>
      <button id="mute" type="button" aria-pressed="false">SOUND ON</button>
    </div>

    <section id="clear-panel" hidden aria-live="polite">
      <p><strong>CLEAR!</strong><span id="clear-summary"></span></p>
      <div class="actions">
        <a id="post-x" class="btn btn-x" href="https://x.com/intent/post" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X でポスト
        </a>
        <button id="retry" class="btn btn-ghost" type="button">もう一度</button>
      </div>
    </section>

    <ul class="howto">
      <li><b>操作</b> — どのキーでも / 画面タップでも。短く押すと小ジャンプ、長押しで大ジャンプ。</li>
      <li><b>充電帯</b> — 空中の水色の帯に居る間だけ点が入り、ゲージが溜まる。上ほど速く溜まるが、ドローンも上ほど多い。</li>
      <li><b>RUSH</b> — ゲージ満タンで無敵。ぶつかった障害物を壊して +50 点。</li>
      <li><b>クリア</b> — <span id="goal">2000</span> 点に届いたらクリア。クリアタイムを X でポストできる。</li>
    </ul>
  </main>
  <footer>M5Stack Cardputer ADV 向けに作ったゲームの Web 版</footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
